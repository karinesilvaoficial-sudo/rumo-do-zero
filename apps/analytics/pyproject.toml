[project]
name = "rumo-analytics"
version = "0.1.0"
description = "RUMO — cálculos determinísticos, projeções, exportações e PDF"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.2",
  "pydantic==2.14.3",
  "reportlab==5.1.0",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "uvicorn==0.54.0", "pypdf==7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.uv]
package = false
